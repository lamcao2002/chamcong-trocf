name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          APP_ENV: local
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chamcong

  db:
    name: Migration check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chamcong
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chamcong"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/chamcong
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Migration files are consistent
        if: hashFiles('drizzle/meta/_journal.json') != ''
        run: npm run db:check

      - name: Apply migrations to empty database
        run: npm run db:migrate

      - name: Apply again (must be idempotent)
        run: npm run db:migrate

      - name: Seed demo data
        if: hashFiles('drizzle/meta/_journal.json') != ''
        run: npm run db:seed

      - name: Seed again (must be idempotent)
        if: hashFiles('drizzle/meta/_journal.json') != ''
        run: npm run db:seed

      - name: API tests against a running build
        if: hashFiles('drizzle/meta/_journal.json') != ''
        env:
          API_BASE_URL: http://localhost:3000
          CRON_SECRET: ci-cron-secret-for-tests
        run: |
          npm run build
          npm run start &
          npx --yes wait-on@8 --timeout 60000 http://localhost:3000/api/v1/health
          npm run test:api

      - name: Schema has no un-generated changes
        if: hashFiles('drizzle/meta/_journal.json') != ''
        run: |
          npm run db:generate -- --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::lib/db/schema.ts đã thay đổi nhưng chưa chạy 'npm run db:generate' và commit thư mục drizzle/"
            git status --porcelain drizzle
            exit 1
          fi
